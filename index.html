<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050608">
  <title>СКОРО</title>

  <!--
    SOSITE BELYE!
  -->

  <style>
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/press-start-2p-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Press Start 2P';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/press-start-2p-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --paper: #f3e7c9;
      --gold: #f0c04a;
      --gold-soft: #a39168;
      --ink: #050608;
      --pixel: 'Press Start 2P', monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--pixel);
      -webkit-font-smoothing: none;
    }

    /* ===== ФОН ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #050608;
      background-image: url('soon_bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(.92) contrast(1.08);
      transform: scale(1.02);
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 22%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.86) 100%),
        linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,.12) 42%, rgba(0,0,0,.62));
    }

    /* ===== СКАН-ЛИНИИ И СВЕТ ===== */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,.018) 0 1px,
        rgba(0,0,0,.16) 1px 3px
      );
      mix-blend-mode: overlay;
    }
    .sweep {
      position: fixed;
      inset: -20%;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        100deg,
        transparent 0%,
        transparent 46%,
        rgba(110,247,223,.035) 50%,
        transparent 54%,
        transparent 100%
      );
      animation: sweep 9s linear infinite;
    }
    .frame {
      position: fixed;
      inset: 18px;
      z-index: 4;
      pointer-events: none;
      border: 2px solid rgba(163,145,104,.28);
      outline: 4px solid rgba(0,0,0,.55);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.5), inset 0 0 90px rgba(0,0,0,.5);
    }
    .frame::before,
    .frame::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--gold-soft);
      border-style: solid;
      opacity: .75;
    }
    .frame::before {
      top: -2px;
      left: -2px;
      border-width: 3px 0 0 3px;
    }
    .frame::after {
      right: -2px;
      bottom: -2px;
      border-width: 0 3px 3px 0;
    }

    /* ===== КОНТЕНТ ===== */
    main {
      position: relative;
      z-index: 5;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 6vw, 72px);
      text-align: center;
    }

    .soon {
      margin: 0;
      color: var(--paper);
      font-size: clamp(58px, 17vw, 190px);
      line-height: .92;
      letter-spacing: clamp(2px, .5vw, 10px);
      text-transform: uppercase;
      text-shadow:
        4px 4px 0 #070a10,
        8px 8px 0 rgba(0,0,0,.55),
        0 0 28px rgba(240,192,74,.18),
        0 0 80px rgba(240,192,74,.08);
      animation: breathe 4.6s ease-in-out infinite;
    }

    .divider {
      width: min(520px, 72vw);
      display: flex;
      align-items: center;
      gap: 14px;
      margin: clamp(24px, 4vw, 44px) 0 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      height: 2px;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      opacity: .8;
    }
    .divider span {
      width: 10px;
      height: 10px;
      background: var(--gold);
      box-shadow: 0 0 14px rgba(240,192,74,.55);
      transform: rotate(45deg);
    }

    @keyframes breathe {
      0%, 100% {
        text-shadow:
          4px 4px 0 #070a10,
          8px 8px 0 rgba(0,0,0,.55),
          0 0 24px rgba(240,192,74,.14),
          0 0 70px rgba(240,192,74,.06);
      }
      50% {
        text-shadow:
          4px 4px 0 #070a10,
          8px 8px 0 rgba(0,0,0,.55),
          0 0 38px rgba(240,192,74,.28),
          0 0 110px rgba(240,192,74,.12);
      }
    }
    @keyframes sweep {
      0% { transform: translateX(-38%); }
      100% { transform: translateX(38%); }
    }

    @media (max-width: 640px) {
      .frame { inset: 10px; }
      .soon { letter-spacing: 1px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .soon, .sweep { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>

  <main>
    <h1 class="soon">СКОРО</h1>
    <div class="divider" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
